[project]
name = "gdx-tools"
version = "0.0.1"
description = "Command-line utilities for GDX files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gamsapi[transfer]>=52.4.0",
]

[dependency-groups]
dev = [
    # "detect-secrets>=1.5.0",
    "pre-commit>=4.5.1",
    { include-group = "lint-cpp" },
    { include-group = "lint-python" },
]
lint-cpp = [
    "clang-format>=22.1.5",
    "clangd-tidy>=1.1.1",
]
lint-python = [
    "ruff>=0.14.13",
    "ty>=0.0.9",
]

[tool.ruff.lint]
extend-select = ["I"]
